# Charara on the Raspberry Pi - real board on I2C.
#
#   cd docker
#   docker compose up -d --build                     # console + ui + tailscale
#   docker compose --profile brain up -d --build     # + the headless brain
#
# The console and the brain BOTH own the I2C bus: run the brain only when the
# console is not driving the robot (or stop the api service first). The
# strategies volume is shared, so a strategy saved in the console is what the
# brain plays.
#
# Remote access: the vpn service joins the tailnet (set TS_AUTHKEY in
# docker/.env), so from any of your devices open http://<tailnet-name>:8080.
#
# Optional overrides live in docker/.env (see docker/.env.example).

name: charara

services:
  api:
    build:
      context: ..
      dockerfile: docker/console.Dockerfile
    container_name: charara-api
    restart: unless-stopped
    environment:
      ROBOT_TRANSPORT: ${ROBOT_TRANSPORT:-i2c}
      I2C_BUS: ${I2C_BUS:-1}
      I2C_ADDRESS: ${I2C_ADDRESS:-0x0A}
      FIELD_WIDTH_MM: ${FIELD_WIDTH_MM:-3000}
      FIELD_HEIGHT_MM: ${FIELD_HEIGHT_MM:-2000}
      DEFAULT_SPEED_MM_S: ${DEFAULT_SPEED_MM_S:-200}
      TELEMETRY_HZ: ${TELEMETRY_HZ:-10}
      # Optional sensor fusion (Docs/09); absent hardware is fine.
      CAMERA_POSES: ${CAMERA_POSES:-1}
      IMU: ${IMU:-1}
      GYRO_STREAM: ${GYRO_STREAM:-1}
      STREAMING_EXEC: ${STREAMING_EXEC:-0}
      REANCHOR: ${REANCHOR:-1}
      IMU_BUS: ${IMU_BUS:-6}
      IMU_ADDRESS: ${IMU_ADDRESS:-0x68}
      # Calibrated gyro knobs - the console Calibration tab prints the exact
      # docker/.env lines (Docs/09 section 9.3): GYRO_SCALE from the hand-spin
      # test, GYRO_SIGMA_DEG_S from the rest-noise measurement. Recreate the
      # containers (docker compose up -d) to pick up a change.
      GYRO_SCALE: ${GYRO_SCALE:-1.0}
      GYRO_SIGMA_DEG_S: ${GYRO_SIGMA_DEG_S:-1.5}
    # The board talks on /dev/i2c-1; the MPU6050 IMU sits on /dev/i2c-6
    # (GPIO22/23, dtoverlay=i2c6). deploy.ps1 enables both in config.txt and
    # reboots the Pi once when they are missing.
    devices:
      - /dev/i2c-1:/dev/i2c-1
      - /dev/i2c-6:/dev/i2c-6
    volumes:
      - strategies:/data/strategies
    ports:
      - "8000:8000"

  # The robot's main job: play a saved strategy without the console.
  # Enable with: docker compose --profile brain up -d
  brain:
    build:
      context: ..
      dockerfile: docker/brain.Dockerfile
    container_name: charara-brain
    restart: unless-stopped
    profiles: ["brain"]
    environment:
      ROBOT_TRANSPORT: ${ROBOT_TRANSPORT:-i2c}
      I2C_BUS: ${I2C_BUS:-1}
      I2C_ADDRESS: ${I2C_ADDRESS:-0x0A}
      FIELD_WIDTH_MM: ${FIELD_WIDTH_MM:-3000}
      FIELD_HEIGHT_MM: ${FIELD_HEIGHT_MM:-2000}
      # Optional sensor fusion (Docs/09); absent hardware is fine.
      CAMERA_POSES: ${CAMERA_POSES:-1}
      IMU: ${IMU:-1}
      GYRO_STREAM: ${GYRO_STREAM:-1}
      STREAMING_EXEC: ${STREAMING_EXEC:-0}
      REANCHOR: ${REANCHOR:-1}
      IMU_BUS: ${IMU_BUS:-6}
      IMU_ADDRESS: ${IMU_ADDRESS:-0x68}
      # Calibrated gyro knobs - the console Calibration tab prints the exact
      # docker/.env lines (Docs/09 section 9.3): GYRO_SCALE from the hand-spin
      # test, GYRO_SIGMA_DEG_S from the rest-noise measurement. Recreate the
      # containers (docker compose up -d) to pick up a change.
      GYRO_SCALE: ${GYRO_SCALE:-1.0}
      GYRO_SIGMA_DEG_S: ${GYRO_SIGMA_DEG_S:-1.5}
      # name (or path) of the strategy to play - required for the brain
      STRATEGY: ${STRATEGY:-}
    devices:
      - /dev/i2c-1:/dev/i2c-1
      - /dev/i2c-6:/dev/i2c-6
    volumes:
      - strategies:/data/strategies

  ui:
    build:
      context: ..
      dockerfile: docker/ui.Dockerfile
    container_name: charara-ui
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

  # Remote access (Tailscale): joins this machine to your tailnet so the whole
  # console - and the API - are reachable from any of your devices:
  #   http://<TS_HOSTNAME>:8080    (e.g. http://charara:8080, via MagicDNS)
  #   http://<tailnet-ip>:8080
  # It runs in the HOST network namespace in kernel mode, so exactly the
  # published ports above are what the tailnet sees. Set TS_AUTHKEY in
  # docker/.env (see .env.example); the node identity lives in
  # /var/lib/tailscale and survives rebuilds. Requires /dev/net/tun.
  vpn:
    image: tailscale/tailscale:latest
    container_name: charara-vpn
    restart: unless-stopped
    depends_on:
      - ui
    network_mode: host
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${TS_HOSTNAME:-charara}
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
    volumes:
      - /var/lib/tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN

volumes:
  strategies:
