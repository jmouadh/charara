[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "charara"
version = "3.2.0"
description = "Eurobot robot software: portable core (planning, localization, mission engine) + console service + brain runtime"
readme = "README.md"
requires-python = ">=3.11"
# software.core and software.robot are pure Python (stdlib only).
dependencies = []

[project.optional-dependencies]
# the console service (FastAPI REST/WS + UI hosting)
console = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pydantic>=1.10",
]
# real board on I2C (smbus2); mock mode and tests run without it
hardware = ["smbus2>=0.4.2,<1.0"]
# test extras (TestClient end-to-end tests; httpx < 0.28 for FastAPI < 1.0)
dev = ["httpx>=0.27,<0.28", "pytest-rerunfailures>=14"]

[project.scripts]
charara-brain = "software.brain.__main__:main"

[tool.setuptools.packages.find]
include = ["software*"]
