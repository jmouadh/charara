name: Bug report
description: Something behaves differently from what the documentation says
title: "[BUG] "
labels: ["type/bug", "needs/triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please keep it factual: what you expected, what
        happened, and how to reproduce it.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where does the problem live?
      options:
        - Firmware (STM32)
        - Software (Raspberry Pi)
        - Planner / motion
        - Vision / camera
        - Console / UI
        - Hardware / wiring
        - Documentation
        - CI / tooling
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - REAL board
        - MOCK (simulated)
        - Not applicable
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Console build (SW pill) and board firmware (FW pill), e.g. "SW 3.2.0+20261019.1341, FW 3.5"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the console log lines (`Save log`) or the I2C frames when relevant.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, `pytest` output, board event log (`GET /api/errors`).
    validations:
      required: false
